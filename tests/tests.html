<!doctype html>
<html lang="he" dir="ltr">
<head><meta charset="utf-8"><title>75 Hard tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; background: #111; color: #ddd; padding: 16px; }
  .ok { color: #3ddc84; } .bad { color: #ff4d5e; font-weight: bold; } h1 { font-size: 16px; }
</style></head>
<body>
<h1 id="sum">running…</h1>
<pre id="out"></pre>
<script src="../js/day.js"></script>
<script src="../js/store.js"></script>
<script src="../js/reminders.js"></script>
<script src="../data/ingredients.he.js"></script>
<script src="../js/plate.js"></script>
<script src="../data/workouts.he.js"></script>
<script src="../data/schedule.he.js"></script>
<script>
(function () {
  const D = Day;
  const out = document.getElementById('out');
  const results = { pass: 0, fail: 0, failures: [] };
  const REAL_KEYS_BEFORE = Object.keys(localStorage).filter((k) => k.startsWith('75hard:')).length;

  function test(name, fn) {
    try { fn(); results.pass++; out.innerHTML += `<span class="ok">PASS</span> ${name}\n`; }
    catch (e) {
      results.fail++; results.failures.push(name + ': ' + e.message);
      out.innerHTML += `<span class="bad">FAIL</span> ${name}\n    ${e.message}\n`;
    }
  }
  function eq(a, b, msg) {
    const x = JSON.stringify(a), y = JSON.stringify(b);
    if (x !== y) throw new Error(`${msg || 'expected'}: got ${x}, want ${y}`);
  }

  // local-time helper: month is 1-based
  const T = (y, m, d, h = 12, mi = 0) => new Date(y, m - 1, d, h, mi).getTime();
  const START = '2026-06-01';

  function fresh(startDate = START) {
    const s = D.newState();
    D.startRun(s, startDate, T(2026, 5, 31, 20));
    return s;
  }
  // mark every requirement on a day as done (workouts untimed unless opts say)
  function fullDay(s, key, now, opts = {}) {
    D.TASK_IDS.forEach((id) => D.setTask(s, key, now, id, true));
    D.addWater(s, key, now, D.WATER_GOAL_ML);
    D.setRead(s, key, now, true);
    D.setPhoto(s, key, now, true);
    D.setWorkout(s, key, now, 'w1', Object.assign({ done: true, outdoor: true }, opts.w1));
    D.setWorkout(s, key, now, 'w2', Object.assign({ done: true, outdoor: false }, opts.w2));
  }

  // ---------- date helpers ----------
  test('logicalDate: 04:59 is still yesterday, 05:00 is today', () => {
    eq(D.logicalDate(T(2026, 6, 2, 4, 59), 5), '2026-06-01');
    eq(D.logicalDate(T(2026, 6, 2, 5, 0), 5), '2026-06-02');
  });
  test('logicalDate: cutoff crosses month and year', () => {
    eq(D.logicalDate(T(2026, 7, 1, 2), 5), '2026-06-30');
    eq(D.logicalDate(T(2027, 1, 1, 0, 30), 5), '2026-12-31');
  });
  test('addDays/diffDays: month, year, leap-year and DST-change dates', () => {
    eq(D.addDays('2026-01-31', 1), '2026-02-01');
    eq(D.addDays('2026-12-31', 1), '2027-01-01');
    eq(D.addDays('2028-02-28', 1), '2028-02-29');
    eq(D.diffDays('2026-03-26', '2026-03-30'), 4);   // Israel DST starts 27 Mar 2026
    eq(D.diffDays('2026-10-24', '2026-10-27'), 3);   // and ends 25 Oct 2026
  });
  test('logicalDate right after a spring-forward hour is not off by one', () => {
    // 05:30 local on any day must map to that same date regardless of DST.
    eq(D.logicalDate(T(2026, 3, 27, 5, 30), 5), '2026-03-27');
    eq(D.logicalDate(T(2026, 10, 25, 5, 30), 5), '2026-10-25');
  });

  // ---------- phases / start ----------
  test('phase: unset -> ready -> active, user-chosen start date', () => {
    const s = D.newState();
    eq(D.phase(s, T(2026, 5, 31)), 'unset');
    eq(D.startRun(s, START, T(2026, 5, 31, 20)).ok, true);
    eq(D.phase(s, T(2026, 5, 31, 20)), 'ready');
    eq(D.status(s, T(2026, 5, 31, 20)).daysUntilStart, 1);
    eq(D.phase(s, T(2026, 6, 1, 6)), 'active');
    eq(D.status(s, T(2026, 6, 1, 6)).dayNumber, 1);
  });
  test('startRun rejects a past date and a bad date', () => {
    const s = D.newState();
    eq(D.startRun(s, '2026-05-01', T(2026, 5, 31)).error, 'past');
    eq(D.startRun(s, 'nope', T(2026, 5, 31)).error, 'bad-date');
  });
  test('nothing is editable before the start date', () => {
    const s = fresh();
    eq(D.setTask(s, '2026-05-31', T(2026, 5, 31, 20), 'meal1', true), false);
  });
  test('changeStartDate works only while ready', () => {
    const s = fresh();
    eq(D.changeStartDate(s, '2026-06-05', T(2026, 5, 31, 20)).ok, true);
    eq(s.run.startDate, '2026-06-05');
    const s2 = fresh();
    eq(D.changeStartDate(s2, '2026-06-05', T(2026, 6, 1, 9)).error, 'not-ready');
  });

  // ---------- a good day ----------
  test('complete day: End my day succeeds, best streak = 1', () => {
    const s = fresh(); const now = T(2026, 6, 1, 22);
    fullDay(s, START, now);
    const r = D.endDay(s, now);
    eq(r.ok, true); eq(r.dayNumber, 1);
    eq(s.best, 1); eq(D.status(s, now).closedToday, true);
  });
  test('closed day is locked for edits', () => {
    const s = fresh(); const now = T(2026, 6, 1, 22);
    fullDay(s, START, now); D.endDay(s, now);
    eq(D.addWater(s, START, now, 500), false);
    eq(D.endDay(s, now).error, 'already-closed');
  });
  test('progress ring: empty 0%, full 100%', () => {
    const s = fresh(); const now = T(2026, 6, 1, 9);
    eq(D.progress(s, START).pct, 0);
    fullDay(s, START, now);
    eq(D.progress(s, START).pct, 100);
  });

  test('setMeal ticks the meal task and records the text; rejects non-meal ids and closed days', () => {
    const s = fresh(); const now = T(2026, 6, 1, 13);
    eq(D.setMeal(s, START, now, 'meal2', 'סלט טונה'), true);
    eq(s.days[START].tasks.meal2, true); eq(s.days[START].meals.meal2, 'סלט טונה');
    eq(D.setMeal(s, START, now, 'water', 'x'), false);
    eq(D.setMeal(s, '2026-06-02', now, 'meal1', 'x'), false);   // not today
  });

  // ---------- missing items ----------
  test('endDay with missing items refuses and changes nothing', () => {
    const s = fresh(); const now = T(2026, 6, 1, 22);
    D.setTask(s, START, now, 'meal1', true);
    const r = D.endDay(s, now);
    eq(r.error, 'missing'); eq(r.missing.includes('meal2'), true);
    eq(s.days[START].closed, null); eq(s.run.attempt, 1);
  });
  test('water: 3799 ml fails, 3800 passes', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now); D.addWater(s, START, now, -1);
    eq(D.evaluateDay(s, START), ['water']);
    D.addWater(s, START, now, 1);
    eq(D.evaluateDay(s, START), []);
  });
  test('reading is a plain checkmark: unchecked fails, checked passes', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now); D.setRead(s, START, now, false);
    eq(D.evaluateDay(s, START), ['read']);
    D.setRead(s, START, now, true);
    eq(D.evaluateDay(s, START), []);
  });
  test('negative rules are not tracked: no checkbox ids, nothing else is required', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    eq(D.TASK_IDS, ['meal1', 'meal2', 'meal3']);
    eq(D.setTask(s, START, now, 'nosnack', true), false);
    eq(D.setTask(s, START, now, 'rule2', true), false);
    fullDay(s, START, now);
    eq(D.evaluateDay(s, START), []);          // a day with only the positive tasks is complete
  });
  test('outdoor: both workouts indoors fails', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now, { w1: { outdoor: false } });
    eq(D.evaluateDay(s, START), ['outdoor']);
  });
  test('outdoor can be either workout', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now, { w1: { outdoor: false }, w2: { outdoor: true } });
    eq(D.evaluateDay(s, START), []);
  });
  test('workout shorter than 45 min fails; 90 min sports session passes', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now, { w1: { min: 44 }, w2: { min: 90 } });
    eq(D.evaluateDay(s, START), ['w1min']);
  });
  test('workout gap: 2h fails, exactly 3h passes (setting = 3h)', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now, {
      w1: { startedAt: T(2026, 6, 1, 8), endedAt: T(2026, 6, 1, 8, 45), min: 45 },
      w2: { startedAt: T(2026, 6, 1, 10, 45), endedAt: T(2026, 6, 1, 11, 30), min: 45 }
    });
    eq(D.evaluateDay(s, START), ['gap']);
    D.setWorkout(s, START, now, 'w2', { startedAt: T(2026, 6, 1, 11, 45), endedAt: T(2026, 6, 1, 12, 30) });
    eq(D.evaluateDay(s, START), []);
  });
  test('gap is measured regardless of which workout is logged first', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now, {
      w1: { startedAt: T(2026, 6, 1, 18), endedAt: T(2026, 6, 1, 18, 45), min: 45 },
      w2: { startedAt: T(2026, 6, 1, 17), endedAt: T(2026, 6, 1, 17, 45), min: 45 }
    });
    eq(D.evaluateDay(s, START), ['gap']);
  });

  // ---------- restart (warn -> confirm) ----------
  test('endDay confirmFail restarts: attempt 2, history logged, new start = tomorrow', () => {
    const s = fresh(); const now = T(2026, 6, 1, 22);
    D.setTask(s, START, now, 'meal1', true);
    const r = D.endDay(s, now, { confirmFail: true });
    eq(r.reset, true);
    eq(s.run.attempt, 2); eq(s.run.startDate, '2026-06-02');
    eq(s.history.length, 1); eq(s.history[0].dayNumber, 1);
    eq(D.phase(s, now), 'ready');
  });
  test('best streak survives a restart', () => {
    const s = fresh();
    [1, 2, 3].forEach((n) => { const now = T(2026, 6, n, 22); fullDay(s, `2026-06-0${n}`, now); D.endDay(s, now); });
    const now = T(2026, 6, 4, 22);
    D.endDay(s, now, { confirmFail: true });
    eq(s.best, 3); eq(s.run.attempt, 2);
  });

  // ---------- forgot End my day / app not opened ----------
  test('forgot End my day: complete day auto-closes OK at the next 05:00', () => {
    const s = fresh();
    fullDay(s, START, T(2026, 6, 1, 21));
    D.sync(s, T(2026, 6, 2, 4, 59));
    eq(s.days[START].closed, null);               // still "yesterday" at 04:59
    D.sync(s, T(2026, 6, 2, 5, 0));
    eq(s.days[START].closed.ok, true); eq(s.days[START].closed.auto, true);
    eq(D.phase(s, T(2026, 6, 2, 5, 0)), 'active');
    eq(s.best, 1);
  });
  test('forgot End my day with a missing item: pending (warn), not an instant reset', () => {
    const s = fresh();
    D.setTask(s, START, T(2026, 6, 1, 21), 'meal1', true);
    D.sync(s, T(2026, 6, 2, 8));
    eq(D.phase(s, T(2026, 6, 2, 8)), 'pending');
    eq(s.pending.dayKey, START); eq(s.run.attempt, 1);
  });
  test('pending: fixing the mis-tapped item resolves it, no reset', () => {
    const s = fresh();
    fullDay(s, START, T(2026, 6, 1, 21));
    D.setTask(s, START, T(2026, 6, 1, 21), 'meal3', false);      // user thinks they unticked by mistake
    D.sync(s, T(2026, 6, 2, 8));
    eq(s.pending.missing, ['meal3']);
    eq(D.setTask(s, START, T(2026, 6, 2, 8), 'meal3', true), true); // editing yesterday allowed while pending
    const r = D.reevaluatePending(s, T(2026, 6, 2, 8));
    eq(r.resolved, true); eq(s.pending, null); eq(s.run.attempt, 1);
    eq(s.best, 1); eq(D.phase(s, T(2026, 6, 2, 8)), 'active');
  });
  test('pending: still-missing item stays pending; confirmReset restarts today', () => {
    const s = fresh();
    D.sync(s, T(2026, 6, 3, 8));                    // two days untouched; day 1 fails first
    eq(s.pending.dayKey, START);
    eq(D.reevaluatePending(s, T(2026, 6, 3, 8)).resolved, false);
    const r = D.confirmReset(s, T(2026, 6, 3, 8));
    eq(r.ok, true); eq(s.run.startDate, '2026-06-03'); eq(s.run.attempt, 2);
    eq(D.phase(s, T(2026, 6, 3, 8)), 'active');
  });
  test('days that were never opened count as failed', () => {
    const s = fresh();
    fullDay(s, START, T(2026, 6, 1, 21)); D.endDay(s, T(2026, 6, 1, 22));
    D.sync(s, T(2026, 6, 4, 9));                    // days 2 and 3 never touched
    eq(s.pending.dayKey, '2026-06-02');
    eq(s.best, 1);
  });
  test('only the pending day is editable, not older/newer closed days', () => {
    const s = fresh();
    fullDay(s, START, T(2026, 6, 1, 21)); D.endDay(s, T(2026, 6, 1, 22));
    D.sync(s, T(2026, 6, 3, 9));
    eq(s.pending.dayKey, '2026-06-02');
    eq(D.canEdit(s, START, T(2026, 6, 3, 9)), false);
    eq(D.canEdit(s, '2026-06-02', T(2026, 6, 3, 9)), true);
  });

  // ---------- honor-system restart ----------
  test('manualRestart: history entry, attempt+1, new Day 1 tomorrow, best kept, timer cleared', () => {
    const s = fresh();
    const n1 = T(2026, 6, 1, 22); fullDay(s, START, n1); D.endDay(s, n1);
    const n2 = T(2026, 6, 2, 15);
    s.timer = { id: 'w1', dayKey: '2026-06-02', startedAt: n2, outdoor: true };
    const r = D.manualRestart(s, n2);
    eq(r.ok, true); eq(r.startDate, '2026-06-03'); eq(r.attempt, 2);
    eq(s.history.length, 1); eq(s.history[0].dayNumber, 2); eq(s.history[0].missing, ['manual']);
    eq(s.best, 1); eq(s.timer, null);
    eq(D.phase(s, n2), 'ready');
  });
  test('manualRestart refuses before the start date, while pending, and with no run', () => {
    eq(D.manualRestart(D.newState(), T(2026, 6, 1)).error, 'no-run');
    eq(D.manualRestart(fresh(), T(2026, 5, 31, 20)).error, 'not-started');
    const s = fresh(); D.sync(s, T(2026, 6, 2, 8));          // day 1 untouched -> pending
    eq(D.manualRestart(s, T(2026, 6, 2, 8)).error, 'pending');
  });

  // ---------- interchangeable workouts ----------
  test('planFor precedence: day override > weekly plan > calendar default', () => {
    const s = fresh(); const now = T(2026, 6, 1, 9);                 // 2026-06-01 is a Monday
    const dflt = Schedule.planFor(s, START, 'w2');
    eq(dflt.source, 'default'); eq(dflt.text, Schedule.DAYS[1].w2);
    s.settings.weekPlan[1] = { w2: 'שחייה' };
    eq(Schedule.planFor(s, START, 'w2'), { text: 'שחייה', sports: false, source: 'week' });
    eq(Schedule.planFor(s, START, 'w1').source, 'default');          // only w2 was overridden
    eq(D.setWorkoutPlan(s, START, now, 'w2', 'כדורסל עם חברים'), true);
    eq(Schedule.planFor(s, START, 'w2'), { text: 'כדורסל עם חברים', sports: true, source: 'day' });
    D.setWorkoutPlan(s, START, now, 'w2', '');                        // clear -> back to the weekly plan
    eq(Schedule.planFor(s, START, 'w2').source, 'week');
  });
  test('setWorkoutPlan: refused once the workout is done, on other days and for bad ids', () => {
    const s = fresh(); const now = T(2026, 6, 1, 9);
    D.setWorkout(s, START, now, 'w1', { done: true });
    eq(D.setWorkoutPlan(s, START, now, 'w1', 'x'), false);
    eq(D.setWorkoutPlan(s, '2026-06-02', now, 'w2', 'x'), false);
    eq(D.setWorkoutPlan(s, START, now, 'water', 'x'), false);
  });
  test('Schedule.options: distinct sessions + routines, sports flagged', () => {
    const o = Schedule.options();
    eq(new Set(o.map((x) => x.text)).size, o.length);
    eq(o.some((x) => x.text.startsWith('אפשרות א׳')), true);
    eq(o.filter((x) => x.sports).length >= 1, true);
  });
  // ---------- full 75 days ----------
  test('completing day 75 finishes the challenge', () => {
    const s = fresh(); let last;
    for (let n = 0; n < 75; n++) {
      const key = D.addDays(START, n);
      const [y, m, d] = key.split('-').map(Number);
      const now = T(y, m, d, 22);
      fullDay(s, key, now);
      last = D.endDay(s, now);
      eq(last.ok, true);
    }
    eq(last.completed, true); eq(s.best, 75);
    eq(D.phase(s, T(2026, 8, 20)), 'complete');
  });

  // ---------- measurements + milestones ----------
  test('measurements: add, same-day replace, sorted, invalid rejected, remove', () => {
    const s = fresh();
    eq(D.addMeasurement(s, '2026-06-08', 80.44, 90), true);
    eq(D.addMeasurement(s, '2026-06-01', 82, null), true);
    eq(D.addMeasurement(s, '2026-06-08', 79.9, 89.5), true);        // replaces 06-08
    eq(s.measurements.map((m) => m.date), ['2026-06-01', '2026-06-08']);
    eq(s.measurements[1], { date: '2026-06-08', weight: 79.9, waist: 89.5 });
    eq(D.addMeasurement(s, '2026-06-09', 0, 0), false);
    eq(D.addMeasurement(s, 'bad', 80, 90), false);
    D.removeMeasurement(s, '2026-06-01');
    eq(s.measurements.length, 1);
  });
  test('milestone: due only after day 7 closes OK, once', () => {
    const s = fresh();
    for (let n = 0; n < 6; n++) {
      const key = D.addDays(START, n), [y, m, d] = key.split('-').map(Number), now = T(y, m, d, 22);
      fullDay(s, key, now); D.endDay(s, now);
    }
    eq(D.pendingMilestone(s), null);                                  // 6 days done
    const now7 = T(2026, 6, 7, 22);
    fullDay(s, '2026-06-07', now7); D.endDay(s, now7);
    eq(D.pendingMilestone(s).n, 7);
    D.markCelebrated(s, D.pendingMilestone(s).id);
    eq(D.pendingMilestone(s), null);                                  // not shown twice
  });
  test('milestone: a failed attempt does not celebrate', () => {
    const s = fresh(); const now = T(2026, 6, 1, 22);
    D.endDay(s, now, { confirmFail: true });
    eq(D.pendingMilestone(s), null);
    eq(s.run.attempt, 2);
  });

  // ---------- reminders ----------
  test('reminders.due: latest passed, not-done banner cue only', () => {
    const s = fresh(); const day = D.newDay();
    eq(Reminders.due(s, day, T(2026, 6, 1, 6, 0)), null);
    eq(Reminders.due(s, day, T(2026, 6, 1, 7, 30)).id, 'photo');
    day.photo = true;
    eq(Reminders.due(s, day, T(2026, 6, 1, 9, 0)).id, 'w1');
    day.w1.done = true; day.tasks.meal2 = true;
    eq(Reminders.due(s, day, T(2026, 6, 1, 14, 0)), null);
    eq(Reminders.due(s, day, T(2026, 6, 1, 17, 30)).id, 'w2');
    day.w2.done = true; day.tasks.meal3 = true; day.read = true;      // phonePm / endday never banner
    eq(Reminders.due(s, day, T(2026, 6, 1, 23, 0)), null);
  });
  test('store: backup parse keeps photos map and normalizes new fields', () => {
    const s = fresh();
    const text = JSON.stringify({ app: '75hard', state: s, photos: { '2026-06-01': 'data:image/jpeg;base64,AA' } });
    const p = Store.parseBackup(text);
    eq(Object.keys(p.photos), ['2026-06-01']); eq(Array.isArray(p.state.measurements), true);
    eq(typeof p.state.settings.reminders.photo, 'string');
  });

  // ---------- sticky notes ----------
  // close day #n (1-based) of a run starting START as a clean, successful day
  function finishDay(s, n) {
    const key = D.addDays(START, n - 1), [y, m, d] = key.split('-').map(Number), now = T(y, m, d, 22);
    fullDay(s, key, now);
    return D.endDay(s, now);
  }
  test('noteNumber counts down: day 1 -> 75, day 37 -> 39, day 75 -> 1', () => {
    eq(D.noteNumber(1), 75); eq(D.noteNumber(37), 39); eq(D.noteNumber(75), 1);
  });
  test('pendingNote: none at first; appears after a day closes OK with the countdown number', () => {
    const s = fresh();
    eq(D.pendingNote(s), null);
    finishDay(s, 1);
    const note = D.pendingNote(s);
    eq(note.n, 75); eq(note.dayNumber, 1); eq(note.ids, ['1:1']);
  });
  test('pendingNote: cleared once marked shown; next day gives the next number', () => {
    const s = fresh();
    finishDay(s, 1); D.markNotesShown(s, D.pendingNote(s).ids);
    eq(D.pendingNote(s), null);
    finishDay(s, 2);
    eq(D.pendingNote(s).n, 74);
  });
  test('pendingNote: never for a failed day (confirmed restart) or a day waiting in pending', () => {
    const s = fresh(); const now = T(2026, 6, 1, 22);
    D.endDay(s, now, { confirmFail: true });                 // failed -> new attempt, no OK day
    eq(D.pendingNote(s), null);
    const s2 = fresh(); D.sync(s2, T(2026, 6, 2, 8));        // day 1 untouched -> pending
    eq(D.pendingNote(s2), null);
  });
  test('pendingNote: catch-up shows only the NEWEST note and lists every unseen id', () => {
    const s = fresh();
    [1, 2, 3].forEach((n) => fullDay(s, D.addDays(START, n - 1), T(2026, 6, n, 21)));
    D.sync(s, T(2026, 6, 4, 9));                              // app was shut: days 1-3 auto-close OK
    const note = D.pendingNote(s);
    eq(note.n, 73); eq(note.dayNumber, 3); eq(note.ids, ['1:1', '1:2', '1:3']);
    D.markNotesShown(s, note.ids);
    eq(D.pendingNote(s), null);
  });
  test('pendingNote: a day fixed from the pending state also earns a note', () => {
    const s = fresh();
    fullDay(s, START, T(2026, 6, 1, 21)); D.setTask(s, START, T(2026, 6, 1, 21), 'meal3', false);
    D.sync(s, T(2026, 6, 2, 8));                              // pending (meal3 missing)
    D.setTask(s, START, T(2026, 6, 2, 8), 'meal3', true);
    D.reevaluatePending(s, T(2026, 6, 2, 8));
    eq(D.pendingNote(s).n, 75);
  });
  test('notes are per attempt: a new attempt starts from 75 again and old days are not listed', () => {
    const s = fresh();
    finishDay(s, 1); D.markNotesShown(s, D.pendingNote(s).ids);
    D.manualRestart(s, T(2026, 6, 2, 10));                    // new Day 1 = 2026-06-03
    eq(D.completedNotes(s), []);
    eq(D.pendingNote(s), null);
    const key = '2026-06-03', now = T(2026, 6, 3, 22);
    fullDay(s, key, now); D.endDay(s, now);
    eq(D.pendingNote(s).n, 75); eq(D.pendingNote(s).ids, ['2:1']);
  });
  test('completedNotes lists only closed-OK days of the current run, oldest first', () => {
    const s = fresh();
    finishDay(s, 1); finishDay(s, 2);
    D.ensureDay(s, '2026-06-03').closed = { at: 1, ok: false, auto: true, missing: ['water'] };
    eq(D.completedNotes(s).map((x) => [x.dayNumber, x.n]), [[1, 75], [2, 74]]);
  });
  test('store migration: a save from before notes existed marks finished days as shown (no pop-up flood)', () => {
    const s = fresh();
    finishDay(s, 1); finishDay(s, 2);
    const oldSave = JSON.parse(JSON.stringify(s)); delete oldSave.notesShown;       // what the previous release stored
    const loaded = Store.normalize(oldSave);
    eq(loaded.notesShown, ['1:1', '1:2']); eq(D.pendingNote(loaded), null);
    finishDay(loaded, 3);                                                              // a genuinely new day still shows
    eq(D.pendingNote(loaded).n, 73);
  });
  test('store: a save that already has notesShown keeps it as-is', () => {
    const s = fresh(); finishDay(s, 1);
    const loaded = Store.normalize(JSON.parse(JSON.stringify(s)));                     // notesShown: [] (day 1 not shown)
    eq(loaded.notesShown, []); eq(D.pendingNote(loaded).n, 75);
  });

  // ---------- plate builder ----------
  const P = Plate, SLOTS = ['breakfast', 'lunch', 'dinner'];
  test('catalog: unique ids, valid parts and slots, no empty names', () => {
    const ids = P.ITEMS.map((i) => i.id);
    eq(new Set(ids).size, ids.length, 'duplicate ids');
    const parts = P.PARTS.map((p) => p.id);
    P.ITEMS.forEach((i) => {
      if (!parts.includes(i.part)) throw new Error('bad part ' + i.id);
      if (!['b', 'm', 'bm'].includes(i.slots)) throw new Error('bad slots ' + i.id);
      if (!i.name || !i.grp) throw new Error('missing name/grp ' + i.id);
    });
  });
  test('catalog: every part has plenty of options in every meal (no empty rows)', () => {
    SLOTS.forEach((slot) => P.PARTS.forEach((part) => {
      const n = P.itemsFor(part.id, slot).length;
      if (n < 5) throw new Error(`${slot}/${part.id} has only ${n} items`);
    }));
  });
  test('every item always has substitutes in each meal it appears in (even with its family gone)', () => {
    P.ITEMS.forEach((item) => SLOTS.filter((s) => P.inSlot(item, s)).forEach((slot) => {
      const st = { pantryMissing: [] };
      if (P.swaps(st, item.id, slot).length < 1) throw new Error(`no swap for ${item.id} in ${slot}`);
      // knock out the item's whole family: there must still be something else
      P.ITEMS.filter((i) => i.grp === item.grp).forEach((i) => P.toggleMissing(st, i.id));
      if (P.swaps(st, item.id, slot).length < 1) throw new Error(`no swap outside family for ${item.id} in ${slot}`);
    }));
  });
  test('swaps: same part and meal, available only, same family first, capped', () => {
    const st = { pantryMissing: [] };
    const s1 = P.swaps(st, 'avocado', 'lunch');
    eq(s1.every((i) => i.part === 'fat' && P.inSlot(i, 'lunch')), true);
    eq(s1[0].grp, 'oil');                                      // tahini / olive oil come before nuts
    eq(s1.some((i) => i.id === 'avocado'), false);
    P.toggleMissing(st, 'tahini');
    eq(P.swaps(st, 'avocado', 'lunch').some((i) => i.id === 'tahini'), false);   // missing items are never suggested
    eq(P.swaps(st, 'avocado', 'lunch', 3).length, 3);
  });
  test('swaps: a breakfast item never gets a lunch-only substitute and vice versa', () => {
    P.swaps({ pantryMissing: [] }, 'yogurt', 'breakfast', 99).forEach((i) => eq(P.inSlot(i, 'breakfast'), true, i.id));
    P.swaps({ pantryMissing: [] }, 'steak', 'dinner', 99).forEach((i) => eq(P.inSlot(i, 'dinner'), true, i.id));
    eq(P.swaps({ pantryMissing: [] }, 'nope', 'lunch'), []);
  });
  test('pantry: everything available by default; toggle/clear; unknown ids ignored', () => {
    const st = { pantryMissing: [] };
    eq(P.isMissing(st, 'tuna'), false);
    eq(P.toggleMissing(st, 'tuna'), true); eq(P.isMissing(st, 'tuna'), true);
    P.toggleMissing(st, 'tuna'); eq(P.isMissing(st, 'tuna'), false);
    eq(P.toggleMissing(st, 'not-a-real-id'), false); eq(st.pantryMissing, []);
    P.toggleMissing(st, 'rice'); P.toggleMissing(st, 'tahini'); P.clearMissing(st); eq(st.pantryMissing, []);
    eq(P.isMissing({}, 'tuna'), false);                         // tolerates a state without the field
  });
  test('compose: parts in plate order, items within a part joined by commas', () => {
    eq(P.compose(['tahini', 'egg_fried', 'cucumber', 'sourdough', 'tomato', 'zaatar']),
       'ביצי עין + לחם מחמצת + מלפפון, עגבנייה + טחינה + זעתר');
    eq(P.compose([]), ''); eq(P.compose(['nope']), '');
  });
  test('completeness: needs protein + carb + (veg or fat); says what is missing', () => {
    eq(P.completeness([]).missing, ['חלבון', 'פחמימה', 'ירקות']);
    eq(P.completeness(['egg_fried']).missing, ['פחמימה', 'ירקות']);
    eq(P.completeness(['egg_fried', 'sourdough']).missing, ['ירקות']);
    eq(P.completeness(['egg_fried', 'sourdough', 'cucumber']).complete, true);
    eq(P.completeness(['tuna', 'rice', 'olive_oil']).complete, true);          // a fat counts for the third part
    eq(P.completeness(['tuna', 'rice', 'zaatar']).complete, false);           // flavor alone does not
  });
  test('store: a save without pantryMissing loads with [] and junk ids are dropped', () => {
    eq(Store.normalize({ v: 1, run: null, days: {} }).pantryMissing, []);
    eq(Store.normalize({ v: 1, run: null, days: {}, pantryMissing: ['rice', 5, null, 'tuna'] }).pantryMissing, ['rice', 'tuna']);
  });

  // ---------- storage ----------
  test('store: export -> import round-trips state', () => {
    const s = fresh(); const now = T(2026, 6, 1, 20);
    fullDay(s, START, now); D.setWorkoutPlan(s, START, now, 'w2', 'x');
    const back = Store.importJson(Store.exportJson(s));
    eq(back.days[START].waterMl, D.WATER_GOAL_ML);
    eq(back.days[START].read, true); eq(back.run.startDate, START);
  });
  test('store: a save from an older version gets settings added since (no crash, no undefined)', () => {
    // exactly what the previous release stored: settings present, but no weekPlan / most reminders
    const old = { v: 1, run: null, days: {}, settings: { cutoffHour: 4, gapHours: 3.5, bottleMl: 750, glassMl: 250,
      reminders: { photo: '06:30' }, ruleNames: { r2: 'שם שלי', r3: 'כלל אישי 3 — מקס׳ פעם בשבוע' } } };
    const s = Store.normalize(old);
    eq(s.settings.weekPlan, [null, null, null, null, null, null, null]);
    eq(s.settings.cutoffHour, 4); eq(s.settings.bottleMl, 750);          // user's values survive
    eq(s.settings.reminders.photo, '06:30'); eq(s.settings.reminders.w1, '08:30');   // missing cues filled
    eq(s.settings.ruleNames.r2, 'שם שלי');
    // and it must not alias the defaults: mutating one result can't leak into the next
    s.settings.weekPlan[1] = { w1: 'x' };
    eq(Store.normalize(old).settings.weekPlan[1], null);
  });
  test('store: a very old save with no settings at all still loads with every default', () => {
    const s = Store.normalize({ v: 1, run: null, days: {} });
    eq(s.settings.reminders.endday, '22:30'); eq(s.settings.weekPlan.length, 7); eq(s.settings.ruleNames.r2, 'כלל אישי 2');
  });
  test('store migration: old pages/book/takeaway/r3Log/tasks become read:true, junk dropped', () => {
    const old = { v: 1, run: null, r3Log: ['2026-06-01'], days: {
      '2026-06-01': { tasks: { meal1: true, nosnack: true }, pages: 12, book: 'x', takeaway: 'y' },
      '2026-06-02': { tasks: {}, pages: 9 },
      '2026-06-03': { tasks: {}, read: true } } };
    const s = Store.normalize(old);
    eq(s.days['2026-06-01'].read, true); eq(s.days['2026-06-02'].read, false); eq(s.days['2026-06-03'].read, true);
    eq(s.days['2026-06-01'].pages, undefined); eq(s.days['2026-06-01'].book, undefined);
    eq(s.r3Log, undefined);
  });
  test('migration: a pending day that only failed on removed rules resolves itself', () => {
    const s = fresh(); const now = T(2026, 6, 1, 21);
    fullDay(s, START, now);
    s.pending = { dayKey: START, missing: ['nosnack', 'noalc'], auto: true };   // saved by the old version
    const r = D.reevaluatePending(s, T(2026, 6, 2, 8));
    eq(r.resolved, true); eq(s.pending, null);
  });
  test('store: import rejects files that are not 75hard backups', () => {
    let threw = false;
    try { Store.importJson('{"hello":1}'); } catch (e) { threw = true; }
    eq(threw, true);
  });
  test('store: normalize fills fields missing from an old save', () => {
    const old = { v: 1, days: { '2026-06-01': { tasks: { meal1: true } } }, run: null };
    const s = Store.normalize(old);
    eq(s.days['2026-06-01'].w1.done, false); eq(s.settings.gapHours, 3); eq(s.r3Log, undefined);
    eq(s.settings.weekPlan.length, 7); eq(s.days['2026-06-01'].read, false);
  });
  // In-memory stand-in for localStorage: these tests must NEVER touch the real save
  // (this page shares an origin with the app, and is deployed with it).
  function fakeStorage() {
    const m = new Map();
    return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => { m.set(k, String(v)); }, removeItem: (k) => { m.delete(k); }, _m: m };
  }
  test('store: corrupt save is preserved, not overwritten (in-memory storage only)', () => {
    const fake = fakeStorage(); Store.useBackend(fake);
    try {
      fake.setItem(Store.KEY, '{not json');
      const r = Store.load();
      eq(r.error, 'corrupt'); eq(fake.getItem(Store.CORRUPT_KEY), '{not json');
    } finally { Store.useBackend(null); }
  });
  test('store: save -> load round-trip through the backend', () => {
    const fake = fakeStorage(); Store.useBackend(fake);
    try {
      const s = fresh(); fullDay(s, START, T(2026, 6, 1, 20));
      eq(Store.save(s), true);
      const r = Store.load();
      eq(r.error, null); eq(r.state.days[START].read, true); eq(r.state.run.startDate, START);
      eq(Store.load().state.settings.weekPlan.length, 7);
    } finally { Store.useBackend(null); }
  });
  test('store: unavailable storage (throws) degrades to a fresh state, save reports failure', () => {
    const boom = { getItem() { throw new Error('denied'); }, setItem() { throw new Error('full'); }, removeItem() {} };
    Store.useBackend(boom);
    try {
      eq(Store.load().error, 'unavailable'); eq(Store.save(D.newState()), false);
    } finally { Store.useBackend(null); }
  });
  test('the tests leave the real localStorage untouched', () => {
    eq(Object.keys(localStorage).filter((k) => k.startsWith('75hard:')).length, REAL_KEYS_BEFORE);
  });

  const sum = document.getElementById('sum');
  sum.textContent = `${results.pass} passed, ${results.fail} failed`;
  sum.className = results.fail ? 'bad' : 'ok';
  window.__results = results;
})();
</script>
